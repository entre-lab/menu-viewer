<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Menu Viewer</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #161616;
      --panel-head: #1d1d1d;
      --text: #f2f0eb;
      --zh: #c9c6bf;
      --muted: #8f8b84;
      --line: #2a2926;
      --price: #d8b27a;
      --max: 760px;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .shell {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 16px
        max(110px, calc(92px + env(safe-area-inset-bottom)));
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin: 4px 0 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .share,
    .back {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-head);
      color: var(--text);
      font-size: 14px;
      padding: 9px 13px;
      cursor: pointer;
    }

    .category-nav {
      position: sticky;
      z-index: 12;
      top: max(8px, env(safe-area-inset-top));
      margin: -4px 0 20px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(18,18,18,0.94);
      box-shadow: 0 10px 28px rgba(0,0,0,0.24);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      flex: 0 0 auto;
      min-height: 38px;
      max-width: 180px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--zh);
      padding: 8px 13px;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .category-chip[aria-current="true"] {
      border-color: rgba(216,178,122,0.38);
      background: rgba(216,178,122,0.10);
      color: var(--price);
    }

    .section {
      margin: 0 0 26px;
      scroll-margin-top: 78px;
    }

    .section-title {
      margin: 0 0 14px;
      padding: 2px 8px 0;
      text-align: center;
    }

    .section-original {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .section-zh {
      margin: 8px 0 0;
      color: var(--zh);
      font-size: 16px;
      line-height: 1.4;
    }

    .section-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-line;
      text-align: center;
    }

    .section-note-zh {
      margin-top: 4px;
      color: var(--zh);
    }

    .section-items,
    .order-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(
        180deg,
        rgba(24, 24, 24, 0.98) 0%,
        rgba(19, 19, 19, 0.98) 100%
      );
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .item,
    .order-item {
      padding: 18px 18px 17px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .section-items > .item:first-child,
    .order-list > .order-item:first-child {
      border-top: 0;
    }

    .item-top,
    .order-item-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: baseline;
    }

    .original-name,
    .legacy-original,
    .order-original {
      margin: 0;
      min-width: 0;
      color: var(--text);
      font-size: 17px;
      line-height: 1.35;
      font-weight: 700;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .order-original {
      font-size: 18px;
      line-height: 1.4;
    }

    .price {
      color: var(--price);
      font-size: 16px;
      line-height: 1.35;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .zh-name,
    .order-zh {
      margin: 5px 0 0;
      color: var(--zh);
      font-size: 16px;
      line-height: 1.4;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .order-zh {
      margin-top: 7px;
      font-size: 15px;
      font-weight: 550;
    }

    .original-description,
    .order-original-description {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .zh-description,
    .legacy-zh,
    .order-zh-description {
      margin: 5px 0 0;
      color: var(--zh);
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .order-zh-description {
      color: var(--muted);
      font-size: 13px;
    }

    .item-note,
    .order-note {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-line;
    }

    .item-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .add-button {
      min-width: 86px;
      border: 1px solid rgba(216,178,122,0.45);
      border-radius: 999px;
      background: rgba(216,178,122,0.08);
      color: var(--price);
      padding: 8px 14px;
      cursor: pointer;
    }


    .item-selection-count {
      align-self: center;
      margin-right: auto;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .config-panel {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.025);
    }

    .config-group {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .config-group + .config-group {
      margin-top: 16px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .config-title {
      width: 100%;
      margin: 0 0 9px;
      padding: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
    }

    .config-title-zh {
      display: block;
      margin-top: 2px;
      color: var(--zh);
      font-weight: 600;
    }

    .config-price {
      margin-left: 7px;
      color: var(--price);
      font-weight: 650;
      white-space: nowrap;
    }

    .config-required {
      margin-left: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .config-option {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      padding: 8px 0;
      cursor: pointer;
    }

    .config-option input {
      width: 17px;
      height: 17px;
      margin: 2px 0 0;
      accent-color: var(--price);
    }

    .config-option-text {
      min-width: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .config-option-zh {
      display: block;
      margin-top: 2px;
      color: var(--zh);
      font-size: 13px;
    }

    .config-option-price {
      color: var(--price);
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .config-error {
      min-height: 18px;
      margin: 8px 0 0;
      color: #d9a0a0;
      font-size: 12px;
      line-height: 1.4;
    }

    .config-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .config-cancel,
    .config-confirm {
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .config-cancel {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--zh);
    }

    .config-confirm {
      border: 1px solid rgba(216,178,122,0.45);
      background: rgba(216,178,122,0.10);
      color: var(--price);
    }

    .order-options {
      margin-top: 11px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.025);
    }

    .order-option-group + .order-option-group {
      margin-top: 8px;
    }

    .order-option-title {
      color: var(--zh);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 650;
    }

    .order-option-value {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .stepper {
      display: inline-grid;
      grid-template-columns: 38px 42px 38px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: var(--panel-head);
    }

    .stepper button {
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .stepper .qty {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .order-dock {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: min(calc(100% - 24px), 728px);
      transform: translateX(-50%);
      border: 1px solid rgba(216,178,122,0.35);
      border-radius: 18px;
      background: rgba(29,29,29,0.96);
      box-shadow: 0 12px 36px rgba(0,0,0,0.38);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .order-dock[hidden] { display: none; }

    .order-dock-button {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 0;
      border-radius: inherit;
      background: transparent;
      color: var(--text);
      padding: 12px 16px;
      cursor: pointer;
      text-align: left;
    }

    .order-dock-count {
      color: var(--zh);
      font-size: 13px;
      line-height: 1.35;
    }

    .order-dock-label {
      color: var(--price);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-intro {
      margin: -6px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .order-item-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .order-qty {
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      font-weight: 800;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .order-adjust {
      display: flex;
      justify-content: flex-end;
      margin-top: 13px;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 14px 4px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .order-footer strong {
      color: var(--text);
      font-weight: 700;
    }

    .empty-order {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 22px 18px;
      text-align: center;
      color: var(--zh);
      line-height: 1.55;
    }

    .empty-order button {
      margin-top: 14px;
    }

    .status {
      margin: 18vh auto 0;
      width: min(100%, 520px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      padding: 22px 18px;
      text-align: center;
      color: var(--zh);
      line-height: 1.55;
    }

    .status strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 18px;
    }

    @media (min-width: 640px) {
      .shell { padding-left: 22px; padding-right: 22px; }
      .item,
      .order-item { padding: 19px 20px 18px; }
    }
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite"></main>
  <div class="order-dock" id="orderDock" hidden></div>

  <script>
    (() => {
      "use strict";

      const app = document.getElementById("app");
      const orderDock = document.getElementById("orderDock");

      let currentMenu = null;
      let currentSections = [];
      let currentView = "menu";
      let order = new Map();
      let storageKey = "";
      let categoryObserver = null;
      let categoryNavigationToken = 0;
      let categoryNavigationLock = null;

      const hasText = (value) =>
        typeof value === "string" && value.trim().length > 0;

      const text = (value) => {
        if (value === null || value === undefined) return "";
        return String(value);
      };

      function el(tag, className, value) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (value !== undefined && value !== null) node.textContent = text(value);
        return node;
      }

      function base64UrlToBytes(encoded) {
        if (!encoded) throw new Error("missing payload");

        let base64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const remainder = base64.length % 4;
        if (remainder) base64 += "=".repeat(4 - remainder);

        const binary = atob(base64);
        return Uint8Array.from(binary, (char) => char.charCodeAt(0));
      }

      function decodePayload(encoded) {
        const bytes = base64UrlToBytes(encoded);
        const json = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        return JSON.parse(json);
      }

      async function decodeCompressedPayload(encoded) {
        if (!("DecompressionStream" in window)) {
          throw new Error("gzip unsupported");
        }

        const bytes = base64UrlToBytes(encoded);
        const stream = new Blob([bytes])
          .stream()
          .pipeThrough(new DecompressionStream("gzip"));
        const json = await new Response(stream).text();
        return JSON.parse(json);
      }

      async function getPayload() {
        const params = new URLSearchParams(location.hash.slice(1));
        const compressed = params.get("z");
        if (compressed) return decodeCompressedPayload(compressed);
        return decodePayload(params.get("d"));
      }


      function normalizeGroups(groups) {
        if (!Array.isArray(groups)) return [];

        return groups
          .map((group) => {
            const options = Array.isArray(group?.v)
              ? group.v
                  .map((option) => ({
                    original: hasText(option?.o) ? option.o : "",
                    zh: hasText(option?.z) ? option.z : "",
                    price: hasText(option?.p) ? option.p : ""
                  }))
                  .filter(
                    (option) =>
                      hasText(option.original) ||
                      hasText(option.zh) ||
                      hasText(option.price)
                  )
              : [];

            return {
              original: hasText(group?.o) ? group.o : "",
              zh: hasText(group?.z) ? group.z : "",
              price: hasText(group?.p) ? group.p : "",
              mode:
                group?.m === "n" || group?.m === "many"
                  ? "many"
                  : "one",
              required: group?.r === 1 || group?.r === true,
              options
            };
          })
          .filter(
            (group) =>
              group.options.length > 0 &&
              (hasText(group.original) || hasText(group.zh))
          );
      }

      function normalizeCompactPayload(raw) {
        if (!raw || typeof raw !== "object" || !Array.isArray(raw.s)) {
          return raw;
        }

        return {
          title: hasText(raw.t) ? raw.t : "菜單",
          sections: raw.s.map((section) => ({
            original: hasText(section?.o) ? section.o : "",
            zh: hasText(section?.z) ? section.z : "",
            original_note: hasText(section?.no)
              ? section.no
              : hasText(section?.n)
                ? section.n
                : "",
            zh_note: hasText(section?.nz) ? section.nz : "",
            groups: normalizeGroups(section?.g),
            items: Array.isArray(section?.i)
              ? section.i.map((item) => ({
                  original_name: hasText(item?.o) ? item.o : "",
                  zh_name: hasText(item?.z) ? item.z : "",
                  original_description: hasText(item?.od) ? item.od : "",
                  zh_description: hasText(item?.zd) ? item.zd : "",
                  price: hasText(item?.p) ? item.p : "",
                  original_note: hasText(item?.no)
                    ? item.no
                    : hasText(item?.n)
                      ? item.n
                      : "",
                  zh_note: hasText(item?.nz) ? item.nz : "",
                  groups: normalizeGroups(item?.g)
                }))
              : []
          }))
        };
      }

      function makeStorageKey() {
        let hash = 2166136261;
        const source = location.hash;
        for (let i = 0; i < source.length; i += 1) {
          hash ^= source.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return "menu-viewer-order:" + (hash >>> 0).toString(36);
      }

      function loadOrder() {
        order = new Map();
        storageKey = makeStorageKey();

        try {
          const raw = sessionStorage.getItem(storageKey);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return;

          Object.entries(parsed).forEach(([key, value]) => {
            if (Number.isInteger(Number(value)) && Number(value) > 0) {
              const [base] = key.split("::");
              const [sectionIndex, itemIndex] = base.split(":").map(Number);
              if (
                Number.isInteger(sectionIndex) &&
                Number.isInteger(itemIndex)
              ) {
                order.set(key, {
                  qty: Number(value),
                  sectionIndex,
                  itemIndex,
                  selections: []
                });
              }
              return;
            }

            if (!value || typeof value !== "object") return;

            const qty = Number(value.qty);
            let sectionIndex = Number(value.sectionIndex);
            let itemIndex = Number(value.itemIndex);

            if (
              !Number.isInteger(sectionIndex) ||
              !Number.isInteger(itemIndex)
            ) {
              const [base] = key.split("::");
              [sectionIndex, itemIndex] = base.split(":").map(Number);
            }

            if (
              Number.isInteger(qty) &&
              qty > 0 &&
              Number.isInteger(sectionIndex) &&
              Number.isInteger(itemIndex)
            ) {
              order.set(key, {
                qty,
                sectionIndex,
                itemIndex,
                selections: Array.isArray(value.selections)
                  ? value.selections
                  : []
              });
            }
          });
        } catch {
          order = new Map();
        }
      }

      function saveOrder() {
        try {
          const plain = {};
          order.forEach((entry, key) => {
            if (entry?.qty > 0) plain[key] = entry;
          });
          sessionStorage.setItem(storageKey, JSON.stringify(plain));
        } catch {
          // Ordering still works even when session storage is unavailable.
        }
      }

      function itemKey(sectionIndex, itemIndex) {
        return sectionIndex + ":" + itemIndex;
      }

      function quantityFor(sectionIndex, itemIndex) {
        return order.get(itemKey(sectionIndex, itemIndex))?.qty || 0;
      }

      function configuredQuantityForItem(sectionIndex, itemIndex) {
        let total = 0;
        order.forEach((entry) => {
          if (
            entry?.sectionIndex === sectionIndex &&
            entry?.itemIndex === itemIndex
          ) {
            total += entry.qty || 0;
          }
        });
        return total;
      }

      function totalQuantity() {
        let total = 0;
        order.forEach((entry) => {
          total += entry?.qty || 0;
        });
        return total;
      }

      function selectedItemCount() {
        return order.size;
      }

      function configuredEntryKey(sectionIndex, itemIndex, selections) {
        const signature = encodeURIComponent(JSON.stringify(selections));
        return itemKey(sectionIndex, itemIndex) + "::" + signature;
      }

      function itemFields(item) {
        const structuredKeys = [
          "original_name",
          "zh_name",
          "original_description",
          "zh_description"
        ];
        const structured = structuredKeys.some((key) => hasText(item?.[key]));

        if (structured) {
          return {
            original: hasText(item?.original_name) ? item.original_name : "",
            zh: hasText(item?.zh_name) ? item.zh_name : "",
            originalDescription: hasText(item?.original_description)
              ? item.original_description
              : "",
            zhDescription: hasText(item?.zh_description)
              ? item.zh_description
              : ""
          };
        }

        return {
          original: hasText(item?.original) ? item.original : "",
          zh: hasText(item?.zh) ? item.zh : "",
          originalDescription: "",
          zhDescription: ""
        };
      }

      function showError() {
        orderDock.hidden = true;
        app.replaceChildren();
        const box = el("div", "status");
        box.append(
          el("strong", "", "無法載入菜單資料"),
          el("div", "", "請重新開啟完整的菜單分享連結。")
        );
        app.append(box);
      }

      function preserveScrollRender(renderFn) {
        const y = window.scrollY;
        renderFn();
        requestAnimationFrame(() => window.scrollTo(0, y));
      }

      function changeQuantity(sectionIndex, itemIndex, delta) {
        const key = itemKey(sectionIndex, itemIndex);
        const existing = order.get(key) || {
          qty: 0,
          sectionIndex,
          itemIndex,
          selections: []
        };
        const next = Math.max(0, existing.qty + delta);

        if (next > 0) {
          order.set(key, { ...existing, qty: next });
        } else {
          order.delete(key);
        }

        saveOrder();

        if (currentView === "summary") {
          preserveScrollRender(renderSummary);
        } else {
          preserveScrollRender(renderMenu);
        }
      }

      function changeEntryQuantity(entryKey, delta) {
        const existing = order.get(entryKey);
        if (!existing) return;

        const next = Math.max(0, (existing.qty || 0) + delta);
        if (next > 0) order.set(entryKey, { ...existing, qty: next });
        else order.delete(entryKey);

        saveOrder();

        if (currentView === "summary") {
          preserveScrollRender(renderSummary);
        } else {
          preserveScrollRender(renderMenu);
        }
      }

      function addConfiguredEntry(sectionIndex, itemIndex, selections) {
        const key = configuredEntryKey(
          sectionIndex,
          itemIndex,
          selections
        );
        const existing = order.get(key);

        if (existing) {
          order.set(key, { ...existing, qty: existing.qty + 1 });
        } else {
          order.set(key, {
            qty: 1,
            sectionIndex,
            itemIndex,
            selections
          });
        }

        saveOrder();
        preserveScrollRender(renderMenu);
      }

      function createStepper(sectionIndex, itemIndex, quantity) {
        const stepper = el("div", "stepper");

        const minus = el("button", "", "−");
        minus.type = "button";
        minus.setAttribute("aria-label", "減少數量");
        minus.addEventListener("click", () =>
          changeQuantity(sectionIndex, itemIndex, -1)
        );

        const qty = el("span", "qty", quantity);

        const plus = el("button", "", "+");
        plus.type = "button";
        plus.setAttribute("aria-label", "增加數量");
        plus.addEventListener("click", () =>
          changeQuantity(sectionIndex, itemIndex, 1)
        );

        stepper.append(minus, qty, plus);
        return stepper;
      }

      function createEntryStepper(entryKey, quantity) {
        const stepper = el("div", "stepper");

        const minus = el("button", "", "−");
        minus.type = "button";
        minus.setAttribute("aria-label", "減少數量");
        minus.addEventListener("click", () =>
          changeEntryQuantity(entryKey, -1)
        );

        const qty = el("span", "qty", quantity);

        const plus = el("button", "", "+");
        plus.type = "button";
        plus.setAttribute("aria-label", "增加數量");
        plus.addEventListener("click", () =>
          changeEntryQuantity(entryKey, 1)
        );

        stepper.append(minus, qty, plus);
        return stepper;
      }

      function combinedGroups(item, sectionGroups) {
        const inherited = Array.isArray(sectionGroups)
          ? sectionGroups
          : [];
        const own = Array.isArray(item?.groups) ? item.groups : [];
        return [...inherited, ...own];
      }

      function createConfigurationPanel(
        groups,
        sectionIndex,
        itemIndex,
        onCancel
      ) {
        const panel = el("div", "config-panel");
        const controls = [];

        groups.forEach((group, groupIndex) => {
          const fieldset = el("fieldset", "config-group");
          const legend = el("legend", "config-title");

          if (hasText(group.original)) {
            legend.append(document.createTextNode(group.original));
          }
          if (hasText(group.price)) {
            legend.append(el("span", "config-price", group.price));
          }
          if (group.required) {
            legend.append(el("span", "config-required", "必選"));
          }
          if (hasText(group.zh)) {
            legend.append(el("span", "config-title-zh", group.zh));
          }

          fieldset.append(legend);

          const inputName =
            "option-" + sectionIndex + "-" + itemIndex + "-" + groupIndex;
          const inputs = [];

          if (group.mode === "one" && !group.required) {
            const none = el("label", "config-option");
            const input = document.createElement("input");
            input.type = "radio";
            input.name = inputName;
            input.value = "";
            input.checked = true;
            none.append(
              input,
              el("span", "config-option-text", "不變更")
            );
            fieldset.append(none);
            inputs.push(input);
          }

          group.options.forEach((option, optionIndex) => {
            const row = el("label", "config-option");
            const input = document.createElement("input");
            input.type = group.mode === "many" ? "checkbox" : "radio";
            input.name =
              group.mode === "many"
                ? inputName + "-" + optionIndex
                : inputName;
            input.value = String(optionIndex);

            const label = el("span", "config-option-text");
            if (hasText(option.original)) {
              label.append(document.createTextNode(option.original));
            }
            if (hasText(option.zh)) {
              label.append(el("span", "config-option-zh", option.zh));
            }

            row.append(input, label);
            if (hasText(option.price)) {
              row.append(el("span", "config-option-price", option.price));
            }

            fieldset.append(row);
            inputs.push(input);
          });

          controls.push({ group, inputs });
          panel.append(fieldset);
        });

        const error = el("div", "config-error");
        panel.append(error);

        const actions = el("div", "config-actions");
        const cancel = el("button", "config-cancel", "取消");
        cancel.type = "button";
        cancel.addEventListener("click", onCancel);

        const confirm = el("button", "config-confirm", "確認加入");
        confirm.type = "button";
        confirm.addEventListener("click", () => {
          const selections = [];

          for (const control of controls) {
            const { group, inputs } = control;
            const checked = inputs.filter(
              (input) => input.checked && input.value !== ""
            );

            if (group.required && checked.length === 0) {
              error.textContent = "請完成必選項目。";
              return;
            }

            if (checked.length > 0) {
              selections.push({
                o: group.original,
                z: group.zh,
                p: group.price,
                v: checked.map((input) => {
                  const option = group.options[Number(input.value)];
                  return {
                    o: option?.original || "",
                    z: option?.zh || "",
                    p: option?.price || ""
                  };
                })
              });
            }
          }

          addConfiguredEntry(
            sectionIndex,
            itemIndex,
            selections
          );
        });

        actions.append(cancel, confirm);
        panel.append(actions);
        return panel;
      }

      function renderItem(
        item,
        sectionIndex,
        itemIndex,
        sectionGroups = []
      ) {
        const card = el("article", "item");
        const fields = itemFields(item);
        const top = el("div", "item-top");

        if (hasText(fields.original)) {
          top.append(el("p", "original-name", fields.original));
        } else {
          top.append(el("span", ""));
        }

        if (hasText(item?.price)) {

        card.append(top);

        if (hasText(fields.zh)) {
          card.append(el("p", "zh-name", fields.zh));
        }

        if (hasText(fields.originalDescription)) {

            el("p", "original-description", fields.originalDescription)
          );
        }

        if (hasText(fields.zhDescription)) {
          card.append(el("p", "zh-description", fields.zhDescription));
        }

        if (hasText(item?.original_note)) {
          card.append(el("p", "item-note", item.original_note));
        }

        if (hasText(item?.zh_note)) {
          card.append(el("p", "item-note", item.zh_note));
        } else if (hasText(item?.note)) {
          card.append(el("p", "item-note", item.note));
        }

        const hasOrderableLabel =
          hasText(fields.original) || hasText(fields.zh);

        if (hasOrderableLabel) {

          const groups = combinedGroups(item, sectionGroups);

          if (groups.length > 0) {
            const configuredQuantity = configuredQuantityForItem(
              sectionIndex,
              itemIndex
            );

            if (configuredQuantity > 0) {
              actions.append(
                el(
                  "span",
                  "item-selection-count",
                  "已選 " + configuredQuantity + " 份"
                )
              );
            }

            const add = el(
              "button",
              "add-button",
              configuredQuantity > 0 ? "再加入" : "選擇"
            );
            add.type = "button";
            add.addEventListener("click", () => {
              const existing = card.querySelector(".config-panel");
              if (existing) {
                existing.remove();
                return;
              }

              card.append(
                createConfigurationPanel(
                  groups,
                  sectionIndex,
                  itemIndex,
                  () => card.querySelector(".config-panel")?.remove()
                )
              );
            });
            actions.append(add);
          } else {
            const quantity = quantityFor(sectionIndex, itemIndex);

            if (quantity > 0) {
              actions.append(
                createStepper(sectionIndex, itemIndex, quantity)
              );
            } else {
              const add = el("button", "add-button", "加入");
              add.type = "button";
              add.addEventListener("click", () =>
                changeQuantity(sectionIndex, itemIndex, 1)
              );
              actions.append(add);
            }
          }

          card.append(actions);
        }

        return card;

      function renderSection(section, sectionIndex) {
        const wrap = el("section", "section");
        wrap.id = "menu-section-" + sectionIndex;
        const hasHeading =
          hasText(section?.original) ||
          hasText(section?.zh) ||

      function renderOrderDock() {

      async function shareCurrentUrl(button) {
        const url = location.href;
        const previous = button.textContent;

        try {
          if (navigator.share) {
            await navigator.share({ title: document.title, url });
            return;
          }

          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(url);
            button.textContent = "已複製";
            setTimeout(() => (button.textContent = previous), 1400);
            return;
          }

          throw new Error("share unavailable");
        } catch (error) {
          if (error?.name === "AbortError") return;
          button.textContent = "請複製網址";
          setTimeout(() => (button.textContent = previous), 1800);
        }
      }


      function categorySections() {
        return currentSections
          .map((section, sectionIndex) => ({
            section,
            sectionIndex,
            items: Array.isArray(section?.items) ? section.items : []
          }))
          .filter(({ section, items }) =>
            items.length > 0 &&
            (hasText(section?.original) || hasText(section?.zh))
          );
      }

      function categoryLabel(section) {
        if (hasText(section?.zh)) return section.zh.trim();
        if (hasText(section?.original)) return section.original.trim();
        return "分類";
      }

      function centerCategoryChip(nav, chip) {
        const scroller = nav?.querySelector(".category-scroll");
        if (!scroller || !chip) return;

        const scrollerRect = scroller.getBoundingClientRect();
        const chipRect = chip.getBoundingClientRect();
        const left =
          scroller.scrollLeft +
          (chipRect.left - scrollerRect.left) -
          (scrollerRect.width - chipRect.width) / 2;

        scroller.scrollTo({
          left: Math.max(0, left),
          behavior: "smooth"
        });
      }

      function setActiveCategory(nav, key) {
        let activeChip = null;

        nav.querySelectorAll(".category-chip").forEach((chip) => {
          const active = chip.dataset.category === key;
          chip.setAttribute("aria-current", active ? "true" : "false");
          if (active) activeChip = chip;
        });

        if (activeChip) centerCategoryChip(nav, activeChip);
      }

      function finishCategoryNavigation(nav, token, key) {
        if (token !== categoryNavigationToken) return;

        categoryNavigationLock = null;
        setActiveCategory(nav, key);
      }

      function holdCategoryUntilScrollSettles(nav, key, target) {
        categoryNavigationToken += 1;
        const token = categoryNavigationToken;
        categoryNavigationLock = { token, key };

        let lastY = window.scrollY;
        let stableFrames = 0;
        let frames = 0;

        const check = () => {
          if (
            token !== categoryNavigationToken ||
            currentView !== "menu"
          ) {
            return;
          }

          frames += 1;
          const y = window.scrollY;

          if (Math.abs(y - lastY) < 0.5) stableFrames += 1;
          else stableFrames = 0;

          lastY = y;

          const targetReached =
            key === "all"
              ? window.scrollY < 8
              : target
                ? Math.abs(target.getBoundingClientRect().top - 78) < 28
                : true;

          if ((stableFrames >= 4 && targetReached) || frames > 150) {
            finishCategoryNavigation(nav, token, key);
            return;
          }

          requestAnimationFrame(check);
        };

        requestAnimationFrame(check);
        return token;
      }

      function navigateToCategory(nav, key, target) {
        setActiveCategory(nav, key);
        holdCategoryUntilScrollSettles(nav, key, target);

        if (key === "all") {
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }

        target?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function renderCategoryNav() {
        const categories = categorySections();
        if (categories.length < 3) return null;

        const nav = el("nav", "category-nav");
        nav.setAttribute("aria-label", "菜單分類");

        const scroller = el("div", "category-scroll");
        const all = el("button", "category-chip", "全部");
        all.type = "button";
        all.dataset.category = "all";
        all.setAttribute("aria-current", "true");
        all.addEventListener("click", () => {
          navigateToCategory(nav, "all", null);
        });
        scroller.append(all);

        categories.forEach(({ section, sectionIndex }) => {
          const chip = el(
            "button",
            "category-chip",
            categoryLabel(section)
          );
          chip.type = "button";
          chip.dataset.category = String(sectionIndex);
          chip.setAttribute("aria-current", "false");
          chip.addEventListener("click", () => {
            const target = document.getElementById(
              "menu-section-" + sectionIndex
            );
            navigateToCategory(
              nav,
              String(sectionIndex),
              target
            );
          });
          scroller.append(chip);
        });

        nav.append(scroller);

        nav._categoryIndexes = categories.map(
          ({ sectionIndex }) => sectionIndex
        );

        return nav;
      }


      function initCategoryObserver(nav) {
        if (categoryObserver) categoryObserver.disconnect();
        categoryObserver = null;

        if (!nav || !("IntersectionObserver" in window)) return;

        categoryObserver = new IntersectionObserver(
          (entries) => {
            if (categoryNavigationLock) return;

            if (window.scrollY < 8) {
              setActiveCategory(nav, "all");
              return;
            }

            const visible = entries
              .filter((entry) => entry.isIntersecting)
              .sort(
                (a, b) =>
                  Math.abs(a.boundingClientRect.top) -
                  Math.abs(b.boundingClientRect.top)
              );

            if (!visible.length) return;

            const sectionIndex =
              visible[0].target.dataset.sectionIndex;
            if (sectionIndex !== undefined) {
              setActiveCategory(nav, sectionIndex);
            }
          },
          {
            root: null,
            rootMargin: "-72px 0px -62% 0px",
            threshold: [0, 0.01]
          }
        );

        (nav._categoryIndexes || []).forEach((sectionIndex) => {
          const node = document.getElementById(
            "menu-section-" + sectionIndex
          );
          if (!node) return;
          node.dataset.sectionIndex = String(sectionIndex);
          categoryObserver.observe(node);
        });
      }

        document.title = title + " · Menu Viewer";

        renderOrderDock();
      }

      function orderedEntries() {
        const entries = [];

        currentSections.forEach((section, sectionIndex) => {
          const items = Array.isArray(section?.items) ? section.items : [];
          items.forEach((item, itemIndex) => {
            order.forEach((entry, entryKey) => {
              if (
                entry?.sectionIndex === sectionIndex &&
                entry?.itemIndex === itemIndex &&
                entry?.qty > 0
              ) {
                entries.push({
                  entryKey,
                  sectionIndex,
                  itemIndex,
                  item: item || {},
                  quantity: entry.qty,
                  selections: Array.isArray(entry.selections)
                    ? entry.selections
                    : []
                });
              }
            });
          });
        });

        return entries;
      }


      function parseSimplePrice(value) {
        if (!hasText(value)) return null;

        const raw = value.trim().replace(/\s+/g, "");
        const prefixMatch = raw.match(
          /^([€$£¥￥])([+-]?\d+(?:[.,]\d{1,2})?)$/
        );
        const suffixMatch = raw.match(
          /^([+-]?\d+(?:[.,]\d{1,2})?)(€|EUR|円|¥|￥|\$|USD|£|GBP)$/i
        );

        let amountText = "";
        let currency = "";
        let position = "suffix";

        if (prefixMatch) {
          currency = prefixMatch[1];
          amountText = prefixMatch[2];
          position = "prefix";
        } else if (suffixMatch) {
          amountText = suffixMatch[1];
          currency = suffixMatch[2];
        } else {
          return null;
        }

        const normalized = amountText.replace(",", ".");
        const amount = Number(normalized);
        if (!Number.isFinite(amount)) return null;

        const decimalSeparator = amountText.includes(",")
          ? ","
          : amountText.includes(".")
            ? "."
            : "";
        const fraction = decimalSeparator
          ? amountText.split(decimalSeparator)[1] || ""
          : "";

        return {
          amount,
          currency,
          position,
          decimalSeparator,
          decimals: fraction.length
        };
      }

      function sameCurrency(a, b) {
        if (!a || !b) return false;
        const normalize = (value) => {
          const upper = value.toUpperCase();
          if (upper === "EUR") return "€";
          if (upper === "USD") return "$";
          if (upper === "GBP") return "£";
          if (upper === "¥" || upper === "￥" || upper === "円") return "JPY";
          return upper;
        };
        return normalize(a.currency) === normalize(b.currency);
      }

      function formatConfiguredPrice(amount, template, decimals) {
        const precision = Math.max(
          Number.isInteger(decimals) ? decimals : 0,
          template?.decimals || 0
        );
        let number = amount.toFixed(precision);

        if (template?.decimalSeparator === ",") {
          number = number.replace(".", ",");
        }

        const currency = template?.currency || "";
        return template?.position === "prefix"
          ? currency + number
          : number + currency;
      }

      function configuredUnitPrice(item, selections) {
        const baseText = hasText(item?.price) ? item.price : "";
        const priceParts = [];

        (Array.isArray(selections) ? selections : []).forEach((selection) => {
          if (hasText(selection?.p)) priceParts.push(selection.p);
          const values = Array.isArray(selection?.v) ? selection.v : [];
          values.forEach((option) => {
            if (hasText(option?.p)) priceParts.push(option.p);
          });
        });

        if (!priceParts.length) {
          return { text: baseText, calculated: false, hasAdjustments: false };
        }

        const base = parseSimplePrice(baseText);
        if (!base) {
          return {
            text: baseText ? baseText + " + 加價" : "含加價選項",
            calculated: false,
            hasAdjustments: true
          };
        }

        let total = base.amount;
        let decimals = base.decimals;

        for (const part of priceParts) {
          const parsed = parseSimplePrice(part);
          if (!parsed || !sameCurrency(base, parsed)) {
            return {
              text: baseText + " + 加價",
              calculated: false,
              hasAdjustments: true
            };
          }

          total += parsed.amount;
          decimals = Math.max(decimals, parsed.decimals);
        }

        return {
          text: formatConfiguredPrice(total, base, decimals),
          calculated: true,
          hasAdjustments: true
        };
      }

      function renderOrderSelections(selections) {
        if (!Array.isArray(selections) || selections.length === 0) {
          return null;
        }

        const wrap = el("div", "order-options");

        selections.forEach((selection) => {
          const group = el("div", "order-option-group");
          const titleParts = [];

          if (hasText(selection?.o)) titleParts.push(selection.o);
          if (hasText(selection?.z)) titleParts.push(selection.z);

          const title = el(
            "div",
            "order-option-title",
            titleParts.join(" / ")
          );
          if (hasText(selection?.p)) {
            title.append(
              document.createTextNode("  " + selection.p)
            );
          }
          group.append(title);

          const values = Array.isArray(selection?.v) ? selection.v : [];
          values.forEach((option) => {
            const valueParts = [];
            if (hasText(option?.o)) valueParts.push(option.o);
            if (hasText(option?.z)) valueParts.push(option.z);

            let valueText = valueParts.join(" / ");
            if (hasText(option?.p)) {
              valueText += (valueText ? "  " : "") + option.p;
            }

            if (hasText(valueText)) {
              group.append(
                el("div", "order-option-value", valueText)
              );
            }
          });

          wrap.append(group);
        });

        return wrap;
      }

      function renderOrderItem(entry) {
        const {
          entryKey,
          item,
          quantity,
          selections
        } = entry;
        const fields = itemFields(item);
        const card = el("article", "order-item");
        const top = el("div", "order-item-top");

      function renderSummary() {
        currentView = "summary";
        orderDock.hidden = true;
        if (categoryObserver) {
          categoryObserver.disconnect();
          categoryObserver = null;
        }
        categoryNavigationToken += 1;
        categoryNavigationLock = null;
        app.replaceChildren();
        document.title = "點餐清單 · Menu Viewer";

        const header = document.createElement("header");
        header.append(el("h1", "", "點餐清單"));

        const back = el("button", "back", "← 返回菜單");
        back.type = "button";
        back.addEventListener("click", () => {
          currentView = "menu";
          renderMenu();
          window.scrollTo(0, 0);
        });
        header.append(back);
        app.append(header);

        const entries = orderedEntries();

        if (!entries.length) {
          const empty = el("div", "empty-order");
          empty.append(el("div", "", "目前還沒有選擇餐點。"));

          const backToMenu = el("button", "add-button", "返回菜單");
          backToMenu.type = "button";
          backToMenu.addEventListener("click", () => {
            currentView = "menu";
            renderMenu();
          });
          empty.append(backToMenu);
          app.append(empty);
          return;
        }

        const list = el("div", "order-list");
        entries.forEach((entry) =>
          list.append(renderOrderItem(entry))
        );
        app.append(list);

        const footer = el("div", "order-footer");
        footer.append(
          el("span", "", "共 " + selectedItemCount() + " 項"),
          el("strong", "", totalQuantity() + " 份")
        );
        app.append(footer);
      }

      async function loadMenu() {
        try {
          const decoded = await getPayload();
          const raw =
            decoded && typeof decoded.menu === "object" && decoded.menu !== null
              ? decoded.menu
              : decoded;
          const menu = normalizeCompactPayload(raw);

          if (!menu || typeof menu !== "object") throw new Error("bad menu");

          let sections = Array.isArray(menu.sections) ? menu.sections : [];
          if (!sections.length && Array.isArray(menu.items)) {
            sections = [{ items: menu.items }];
          }

          if (!sections.length) throw new Error("empty menu");

          currentMenu = menu;
          currentSections = sections;
          currentView = "menu";
          loadOrder();
          renderMenu();
        } catch {
          currentMenu = null;
          currentSections = [];
          currentView = "menu";
          order = new Map();
          document.title = "Menu Viewer";
          showError();
        }
      }

      window.addEventListener("hashchange", loadMenu);
      loadMenu();
    })();
  </script>
</body>
</html>
