<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Menu Viewer</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #161616;
      --panel-head: #1d1d1d;
      --text: #f2f0eb;
      --zh: #c9c6bf;
      --muted: #8f8b84;
      --line: #2a2926;
      --price: #d8b27a;
      --max: 760px;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .shell {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 16px
        max(110px, calc(92px + env(safe-area-inset-bottom)));
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin: 4px 0 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .share,
    .back {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-head);
      color: var(--text);
      font-size: 14px;
      padding: 9px 13px;
      cursor: pointer;
    }

    .section {
      margin: 0 0 26px;
    }

    .section-title {
      margin: 0 0 14px;
      padding: 2px 8px 0;
      text-align: center;
    }

    .section-original {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .section-zh {
      margin: 8px 0 0;
      color: var(--zh);
      font-size: 16px;
      line-height: 1.4;
    }

    .section-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-line;
      text-align: center;
    }

    .section-items,
    .order-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(
        180deg,
        rgba(24, 24, 24, 0.98) 0%,
        rgba(19, 19, 19, 0.98) 100%
      );
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .item,
    .order-item {
      padding: 18px 18px 17px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .section-items > .item:first-child,
    .order-list > .order-item:first-child {
      border-top: 0;
    }

    .item-top,
    .order-item-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: baseline;
    }

    .original-name,
    .legacy-original,
    .order-original {
      margin: 0;
      min-width: 0;
      color: var(--text);
      font-size: 17px;
      line-height: 1.35;
      font-weight: 700;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .order-original {
      font-size: 18px;
      line-height: 1.4;
    }

    .price {
      color: var(--price);
      font-size: 16px;
      line-height: 1.35;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .zh-name,
    .order-zh {
      margin: 5px 0 0;
      color: var(--zh);
      font-size: 16px;
      line-height: 1.4;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .order-zh {
      margin-top: 7px;
      font-size: 15px;
      font-weight: 550;
    }

    .original-description,
    .order-original-description {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .zh-description,
    .legacy-zh,
    .order-zh-description {
      margin: 5px 0 0;
      color: var(--zh);
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .order-zh-description {
      color: var(--muted);
      font-size: 13px;
    }

    .item-note,
    .order-note {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-line;
    }

    .item-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .add-button {
      min-width: 86px;
      border: 1px solid rgba(216,178,122,0.45);
      border-radius: 999px;
      background: rgba(216,178,122,0.08);
      color: var(--price);
      padding: 8px 14px;
      cursor: pointer;
    }

    .stepper {
      display: inline-grid;
      grid-template-columns: 38px 42px 38px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: var(--panel-head);
    }

    .stepper button {
      height: 36px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .stepper .qty {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .order-dock {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: min(calc(100% - 24px), 728px);
      transform: translateX(-50%);
      border: 1px solid rgba(216,178,122,0.35);
      border-radius: 18px;
      background: rgba(29,29,29,0.96);
      box-shadow: 0 12px 36px rgba(0,0,0,0.38);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .order-dock[hidden] { display: none; }

    .order-dock-button {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 0;
      border-radius: inherit;
      background: transparent;
      color: var(--text);
      padding: 12px 16px;
      cursor: pointer;
      text-align: left;
    }

    .order-dock-count {
      color: var(--zh);
      font-size: 13px;
      line-height: 1.35;
    }

    .order-dock-label {
      color: var(--price);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-intro {
      margin: -6px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .order-item-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .order-qty {
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      font-weight: 800;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .order-adjust {
      display: flex;
      justify-content: flex-end;
      margin-top: 13px;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 14px 4px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .order-footer strong {
      color: var(--text);
      font-weight: 700;
    }

    .empty-order {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 22px 18px;
      text-align: center;
      color: var(--zh);
      line-height: 1.55;
    }

    .empty-order button {
      margin-top: 14px;
    }

    .status {
      margin: 18vh auto 0;
      width: min(100%, 520px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      padding: 22px 18px;
      text-align: center;
      color: var(--zh);
      line-height: 1.55;
    }

    .status strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 18px;
    }

    @media (min-width: 640px) {
      .shell { padding-left: 22px; padding-right: 22px; }
      .item,
      .order-item { padding: 19px 20px 18px; }
    }
  </style>
</head>
<body>
  <main class="shell" id="app" aria-live="polite"></main>
  <div class="order-dock" id="orderDock" hidden></div>

  <script>
    (() => {
      "use strict";

      const app = document.getElementById("app");
      const orderDock = document.getElementById("orderDock");

      let currentMenu = null;
      let currentSections = [];
      let currentView = "menu";
      let order = new Map();
      let storageKey = "";

      const hasText = (value) =>
        typeof value === "string" && value.trim().length > 0;

      const text = (value) => {
        if (value === null || value === undefined) return "";
        return String(value);
      };

      function el(tag, className, value) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (value !== undefined && value !== null) node.textContent = text(value);
        return node;
      }

      function decodePayload(encoded) {
        if (!encoded) throw new Error("missing payload");

        let base64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const remainder = base64.length % 4;
        if (remainder) base64 += "=".repeat(4 - remainder);

        const binary = atob(base64);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        const json = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        return JSON.parse(json);
      }

      function getPayload() {
        const params = new URLSearchParams(location.hash.slice(1));
        return decodePayload(params.get("d"));
      }

      function makeStorageKey() {
        let hash = 2166136261;
        const source = location.hash;
        for (let i = 0; i < source.length; i += 1) {
          hash ^= source.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return "menu-viewer-order:" + (hash >>> 0).toString(36);
      }

      function loadOrder() {
        order = new Map();
        storageKey = makeStorageKey();

        try {
          const raw = sessionStorage.getItem(storageKey);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return;

          Object.entries(parsed).forEach(([key, value]) => {
            const qty = Number(value);
            if (Number.isInteger(qty) && qty > 0) {
              order.set(key, qty);
            }
          });
        } catch {
          order = new Map();
        }
      }

      function saveOrder() {
        try {
          const plain = {};
          order.forEach((value, key) => {
            if (value > 0) plain[key] = value;
          });
          sessionStorage.setItem(storageKey, JSON.stringify(plain));
        } catch {
          // Ordering still works even when session storage is unavailable.
        }
      }

      function itemKey(sectionIndex, itemIndex) {
        return sectionIndex + ":" + itemIndex;
      }

      function quantityFor(sectionIndex, itemIndex) {
        return order.get(itemKey(sectionIndex, itemIndex)) || 0;
      }

      function totalQuantity() {
        let total = 0;
        order.forEach((qty) => { total += qty; });
        return total;
      }

      function selectedItemCount() {
        return order.size;
      }

      function itemFields(item) {
        const structuredKeys = [
          "original_name",
          "zh_name",
          "original_description",
          "zh_description"
        ];
        const structured = structuredKeys.some((key) => hasText(item?.[key]));

        if (structured) {
          return {
            original: hasText(item?.original_name) ? item.original_name : "",
            zh: hasText(item?.zh_name) ? item.zh_name : "",
            originalDescription: hasText(item?.original_description)
              ? item.original_description
              : "",
            zhDescription: hasText(item?.zh_description)
              ? item.zh_description
              : ""
          };
        }

        return {
          original: hasText(item?.original) ? item.original : "",
          zh: hasText(item?.zh) ? item.zh : "",
          originalDescription: "",
          zhDescription: ""
        };
      }

      function showError() {
        orderDock.hidden = true;
        app.replaceChildren();
        const box = el("div", "status");
        box.append(
          el("strong", "", "無法載入菜單資料"),
          el("div", "", "請重新開啟完整的菜單分享連結。")
        );
        app.append(box);
      }

      function preserveScrollRender(renderFn) {
        const y = window.scrollY;
        renderFn();
        requestAnimationFrame(() => window.scrollTo(0, y));
      }

      function changeQuantity(sectionIndex, itemIndex, delta) {
        const key = itemKey(sectionIndex, itemIndex);
        const next = Math.max(0, (order.get(key) || 0) + delta);

        if (next > 0) order.set(key, next);
        else order.delete(key);

        saveOrder();

        if (currentView === "summary") {
          preserveScrollRender(renderSummary);
        } else {
          preserveScrollRender(renderMenu);
        }
      }

      function createStepper(sectionIndex, itemIndex, quantity) {
        const stepper = el("div", "stepper");

        const minus = el("button", "", "−");
        minus.type = "button";
        minus.setAttribute("aria-label", "減少數量");
        minus.addEventListener("click", () =>
          changeQuantity(sectionIndex, itemIndex, -1)
        );

        const qty = el("span", "qty", quantity);

        const plus = el("button", "", "+");
        plus.type = "button";
        plus.setAttribute("aria-label", "增加數量");
        plus.addEventListener("click", () =>
          changeQuantity(sectionIndex, itemIndex, 1)
        );

        stepper.append(minus, qty, plus);
        return stepper;
      }

      function renderItem(item, sectionIndex, itemIndex) {
        const card = el("article", "item");
        const fields = itemFields(item);
        const top = el("div", "item-top");

        if (hasText(fields.original)) {
          top.append(el("p", "original-name", fields.original));
        } else {
          top.append(el("span", ""));
        }

        if (hasText(item?.price)) {
          top.append(el("div", "price", item.price));
        }

        card.append(top);

        if (hasText(fields.zh)) {
          card.append(el("p", "zh-name", fields.zh));
        }

        if (hasText(fields.originalDescription)) {
          card.append(
            el("p", "original-description", fields.originalDescription)
          );
        }

        if (hasText(fields.zhDescription)) {
          card.append(el("p", "zh-description", fields.zhDescription));
        }

        if (hasText(item?.note)) {
          card.append(el("p", "item-note", item.note));
        }

        const hasOrderableLabel =
          hasText(fields.original) || hasText(fields.zh);

        if (hasOrderableLabel) {
          const actions = el("div", "item-actions");
          const quantity = quantityFor(sectionIndex, itemIndex);

          if (quantity > 0) {
            actions.append(
              createStepper(sectionIndex, itemIndex, quantity)
            );
          } else {
            const add = el("button", "add-button", "＋ 加入");
            add.type = "button";
            add.addEventListener("click", () =>
              changeQuantity(sectionIndex, itemIndex, 1)
            );
            actions.append(add);
          }

          card.append(actions);
        }

        return card;
      }

      function renderSection(section, sectionIndex) {
        const wrap = el("section", "section");
        const hasHeading =
          hasText(section?.original) ||
          hasText(section?.zh) ||
          hasText(section?.note);

        if (hasHeading) {
          const title = el("div", "section-title");

          if (hasText(section.original)) {
            title.append(el("h2", "section-original", section.original));
          }

          if (hasText(section.zh)) {
            title.append(el("p", "section-zh", section.zh));
          }

          if (hasText(section.note)) {
            title.append(el("p", "section-note", section.note));
          }

          wrap.append(title);
        }

        const itemsWrap = el("div", "section-items");
        const items = Array.isArray(section?.items) ? section.items : [];
        items.forEach((item, itemIndex) =>
          itemsWrap.append(
            renderItem(item || {}, sectionIndex, itemIndex)
          )
        );
        wrap.append(itemsWrap);

        return wrap;
      }

      function renderOrderDock() {
        orderDock.replaceChildren();

        if (currentView !== "menu" || selectedItemCount() === 0) {
          orderDock.hidden = true;
          return;
        }

        const button = el("button", "order-dock-button");
        button.type = "button";

        const count = el(
          "span",
          "order-dock-count",
          "已選 " + selectedItemCount() + " 項・共 " + totalQuantity() + " 份"
        );
        const label = el("span", "order-dock-label", "查看點餐清單");

        button.append(count, label);
        button.addEventListener("click", () => {
          currentView = "summary";
          renderSummary();
          window.scrollTo(0, 0);
        });

        orderDock.append(button);
        orderDock.hidden = false;
      }

      async function shareCurrentUrl(button) {
        const url = location.href;
        const previous = button.textContent;

        try {
          if (navigator.share) {
            await navigator.share({ title: document.title, url });
            return;
          }

          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(url);
            button.textContent = "已複製";
            setTimeout(() => (button.textContent = previous), 1400);
            return;
          }

          throw new Error("share unavailable");
        } catch (error) {
          if (error?.name === "AbortError") return;
          button.textContent = "請複製網址";
          setTimeout(() => (button.textContent = previous), 1800);
        }
      }

      function renderMenu() {
        currentView = "menu";
        app.replaceChildren();

        const header = document.createElement("header");
        const title = hasText(currentMenu?.title) ? currentMenu.title : "菜單";
        document.title = title + " · Menu Viewer";
        header.append(el("h1", "", title));

        const share = el("button", "share", "分享");
        share.type = "button";
        share.addEventListener("click", () => shareCurrentUrl(share));
        header.append(share);
        app.append(header);

        currentSections.forEach((section, sectionIndex) =>
          app.append(renderSection(section || {}, sectionIndex))
        );

        renderOrderDock();
      }

      function orderedEntries() {
        const entries = [];

        currentSections.forEach((section, sectionIndex) => {
          const items = Array.isArray(section?.items) ? section.items : [];
          items.forEach((item, itemIndex) => {
            const quantity = quantityFor(sectionIndex, itemIndex);
            if (quantity > 0) {
              entries.push({
                sectionIndex,
                itemIndex,
                item: item || {},
                quantity
              });
            }
          });
        });

        return entries;
      }

      function renderOrderItem(entry) {
        const { sectionIndex, itemIndex, item, quantity } = entry;
        const fields = itemFields(item);
        const card = el("article", "order-item");
        const top = el("div", "order-item-top");
        const names = el("div", "");

        if (hasText(fields.original)) {
          names.append(el("p", "order-original", fields.original));
        }

        if (hasText(fields.zh)) {
          names.append(el("p", "order-zh", fields.zh));
        }

        const side = el("div", "order-item-side");
        side.append(el("div", "order-qty", "×" + quantity));

        if (hasText(item?.price)) {
          side.append(el("div", "price", item.price));
        }

        top.append(names, side);
        card.append(top);

        if (hasText(fields.originalDescription)) {
          card.append(
            el(
              "p",
              "order-original-description",
              fields.originalDescription
            )
          );
        }

        if (hasText(fields.zhDescription)) {
          card.append(
            el("p", "order-zh-description", fields.zhDescription)
          );
        }

        if (hasText(item?.note)) {
          card.append(el("p", "order-note", item.note));
        }

        const adjust = el("div", "order-adjust");
        adjust.append(
          createStepper(sectionIndex, itemIndex, quantity)
        );
        card.append(adjust);

        return card;
      }

      function renderSummary() {
        currentView = "summary";
        orderDock.hidden = true;
        app.replaceChildren();
        document.title = "點餐清單 · Menu Viewer";

        const header = document.createElement("header");
        header.append(el("h1", "", "點餐清單"));

        const back = el("button", "back", "← 返回菜單");
        back.type = "button";
        back.addEventListener("click", () => {
          currentView = "menu";
          renderMenu();
          window.scrollTo(0, 0);
        });
        header.append(back);
        app.append(header);

        app.append(
          el(
            "p",
            "summary-intro",
            "原文優先顯示，方便直接給店家確認。"
          )
        );

        const entries = orderedEntries();

        if (!entries.length) {
          const empty = el("div", "empty-order");
          empty.append(el("div", "", "目前還沒有選擇餐點。"));

          const backToMenu = el("button", "add-button", "返回菜單");
          backToMenu.type = "button";
          backToMenu.addEventListener("click", () => {
            currentView = "menu";
            renderMenu();
          });
          empty.append(backToMenu);
          app.append(empty);
          return;
        }

        const list = el("div", "order-list");
        entries.forEach((entry) =>
          list.append(renderOrderItem(entry))
        );
        app.append(list);

        const footer = el("div", "order-footer");
        footer.append(
          el("span", "", "共 " + selectedItemCount() + " 項"),
          el("strong", "", totalQuantity() + " 份")
        );
        app.append(footer);
      }

      function loadMenu() {
        try {
          const raw = getPayload();
          const menu =
            raw && typeof raw.menu === "object" && raw.menu !== null
              ? raw.menu
              : raw;

          if (!menu || typeof menu !== "object") throw new Error("bad menu");

          let sections = Array.isArray(menu.sections) ? menu.sections : [];
          if (!sections.length && Array.isArray(menu.items)) {
            sections = [{ items: menu.items }];
          }

          if (!sections.length) throw new Error("empty menu");

          currentMenu = menu;
          currentSections = sections;
          currentView = "menu";
          loadOrder();
          renderMenu();
        } catch {
          currentMenu = null;
          currentSections = [];
          currentView = "menu";
          order = new Map();
          document.title = "Menu Viewer";
          showError();
        }
      }

      window.addEventListener("hashchange", loadMenu);
      loadMenu();
    })();
  </script>
</body>
</html>
